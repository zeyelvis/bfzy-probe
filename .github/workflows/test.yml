name: GitHub Actions 4节点并发探针实测

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  multi-probe:
    name: 探针节点 ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: 运行探针测试
        run: |
          chmod +x ./test-probe.sh
          ./test-probe.sh
